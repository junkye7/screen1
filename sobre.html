<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nós | Vintage.Eco</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header id="main-header"></header>

    <section class="hero" style="height: 50vh; background-image: url('https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=1920&q=80');">
        <div class="hero-content">
            <h1>Nossa História</h1>
        </div>
    </section>

    <div class="container section">
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 50px; align-items: center;">
            <div>
                <h2 class="section-title" style="text-align: left;">Moda com Propósito</h2>
                <p style="margin-bottom: 20px;">
                    O <strong>VINTAGE.ECO</strong> nasceu da crença de que o luxo não precisa custar o planeta. 
                    Somos apaixonados pela história que cada peça carrega.
                </p>
                <p>
                    Cada item em nosso catálogo passa por um rigoroso processo de autenticação e higienização.
                </p>
            </div>
            <div>
                <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=800&q=80" alt="Nosso estúdio" style="border-radius: 8px;">
            </div>
        </div>
    </div>

    <footer id="main-footer"></footer>

    <script src="js/app.js"></script>
</body>
</html>
