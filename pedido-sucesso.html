<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedido Confirmado | Vintage.Eco</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<footer id="main-footer"></footer>

<header id="main-header"></header>

<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center;">
    
    <div class="container" style="max-width: 600px;">
        <div style="font-size: 4rem; color: var(--accent-color); margin-bottom: 20px;">
            <i class="far fa-check-circle"></i>
        </div>
        <h1 style="margin-bottom: 10px;">Obrigado pela sua compra!</h1>
        <p style="font-size: 1.2rem; color: #666;">Seu pedido <strong>#<span id="order-id"></span></strong> foi confirmado.</p>
        
        <div style="background: white; padding: 20px; border: 1px solid #eee; margin: 30px 0; text-align: left;">
            <p><strong>E-mail de confirmação:</strong> Enviado para seu endereço.</p>
            <p><strong>Prazo de envio:</strong> Até 2 dias úteis.</p>
        </div>

        <a href="index.html" class="btn">Voltar para a Loja</a>
    </div>

    <script>
        // Gerar ID aleatório
        document.getElementById('order-id').innerText = Math.floor(Math.random() * 1000000);
    </script>
</body>
</html>
