<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Carrinho | Vintage.Eco</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header id="main-header"></header>

    <div class="container section" style="margin-top: 80px;">
        <h1 class="section-title">Sua Sacola</h1>
        
        <div class="cart-layout" id="cart-container">
            <div class="cart-items" id="cart-items-list"></div>

            <div class="cart-summary">
                <h3>Resumo do Pedido</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">R$ 0,00</span>
                </div>
                <div class="summary-row">
                    <span>Frete (Estimado)</span>
                    <span>R$ 25,00</span>
                </div>
                <div class="summary-row">
                    <span>Desconto</span>
                    <span id="discount">- R$ 0,00</span>
                </div>
                <hr>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">R$ 0,00</span>
                </div>
                
                <div class="coupon-area">
                    <input type="text" id="coupon-code" placeholder="Cupom">
                    <button onclick="applyCoupon()">Aplicar</button>
                </div>

                <a href="checkout.html" class="btn" style="width: 100%; text-align: center; margin-top: 20px;">Ir para Pagamento</a>
            </div>
        </div>

        <div id="empty-cart-msg" class="hidden" style="text-align: center; padding: 50px;">
            <h2>Sua sacola está vazia</h2>
            <p>Descubra peças únicas antes que elas acabem.</p>
            <a href="produtos.html" class="btn" style="margin-top: 20px;">Ver Novidades</a>
        </div>
    </div>

    <footer id="main-footer"></footer>

    <script src="js/app.js"></script>
    <script src="js/carrinho.js"></script>
</body>
</html>
